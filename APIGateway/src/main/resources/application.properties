spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[1].id=WALLET-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://WALLET-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/wallets/**

spring.cloud.gateway.server.webflux.routes[2].id=TRANSACTION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transactions/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie