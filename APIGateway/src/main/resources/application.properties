spring.application.name=APIGateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ----------------------------
# Spring Cloud Gateway
# ----------------------------

# (Optional) Also enable auto-discovered routes like http://gateway/USER-SERVICE/**
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- Route 1: user-service ---

spring.cloud.gateway.server.webflux.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**



spring.cloud.gateway.server.webflux.routes[1].id=WALLET-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://WALLET-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/wallets/**

# ----------------------------
# Actuator (for debugging routes)
# ----------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# (Optional) Default filters (header hygiene)
# ----------------------------
spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie
# spring.cloud.gateway.default-filters[1]=AddRequestHeader=X-Gateway, api-gateway


